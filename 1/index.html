<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Tic-Tak-Toe</title>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="board" style="position: relative;">
            <div class="cell first" id="0"></div>
            <div class="cell" id="1"></div>
            <div class="cell" id="2"></div>
            <div class="cell" id="3"></div>
            <div class="cell" id="4"></div>
            <div class="cell" id="5"></div>
            <div class="cell" id="6"></div>
            <div class="cell" id="7"></div>
            <div class="cell" id="8"></div>
            <div id="line1" style="position: absolute;"></div>
            <div id="line2" style="position: absolute;"></div>
            <div id="line3" style="position: absolute;"></div>
        </div>
        <div class="myB">
            <div id="O">O</div>
            <button id="restart">Restart</button>
            <div id="X">X</div>
        </div>
        <p class="winning-message" id="winningMessage"></p>
    </div>

    <script src="./main.js"></script>
</body>
</html>
